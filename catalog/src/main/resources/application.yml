server:
  port: 8081

logging:
  level:
    com.order.system: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG

spring:
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: validate
  datasource:
    url: jdbc:postgresql://localhost:5432/order_system?currentSchema=product
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    platform: postgres
  sql:
    init:
      mode: always
      schema-locations: classpath:init-schema.sql
